{% extends 'base.html' %}

{% block title %}Password Updated{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
  <section class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm text-center">
    <div class="mb-6">
      <p class="text-sm uppercase tracking-[0.24em] text-slate-500">Success</p>
      <h1 class="text-3xl font-semibold text-slate-900">Your password has been updated</h1>
      <p class="mt-3 text-slate-600">Your account is now secured with the new password. Use it the next time you sign in.</p>
    </div>
    <a href="{% url 'dashboard' %}" class="inline-flex items-center justify-center rounded-full bg-blue-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-blue-700">Return to dashboard</a>
  </section>
</div>
{% endblock %}
